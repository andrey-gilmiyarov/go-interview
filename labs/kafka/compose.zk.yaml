name: kafka-handbook-zk

services:
  zookeeper:
    image: zookeeper:3.9.3
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: ruok
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  broker:
    image: apache/kafka:3.9.2
    hostname: broker
    # The 3.9.2 image wrapper defaults to KRaft; launch the ZooKeeper-mode
    # server.properties directly so this lab exercises Kafka's ZK mode.
    entrypoint: ["/opt/kafka/bin/kafka-server-start.sh"]
    command: ["/mnt/shared/config/server.properties"]
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:29092:9092"
    volumes:
      - ./docker/kafka-zk/server.properties:/mnt/shared/config/server.properties:ro
      - kafka_data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server broker:19093 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  zookeeper_data:
  zookeeper_datalog:
  kafka_data:
