name: postgres-handbook
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: postgres_lab
      POSTGRES_USER: postgres_lab
      POSTGRES_PASSWORD: postgres_lab
    ports:
      - '127.0.0.1:${POSTGRES_LAB_PORT:-45432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres_lab -d postgres_lab']
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres_data:
